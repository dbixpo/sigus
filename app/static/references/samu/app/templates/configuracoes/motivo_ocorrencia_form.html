{% extends 'base.html' %}
{% block title %}Motivo de Ocorrência — {{ 'Editar' if item else 'Novo' }}{% endblock %}

{% block content %}
<div class="page-header mb-4">
    <h1><i class="bi bi-clipboard-pulse"></i> Motivo de Ocorrência — {{ 'Editar' if item else 'Novo' }}</h1>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nome <span class="text-danger">*</span></label>
                <input type="text" name="nome" class="form-control" value="{{ item.nome if item else '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tipo de Ocorrência</label>
                <select name="tipo_ocorrencia_id" class="form-select">
                    <option value="">— Selecione —</option>
                    {% for t in tipos %}
                    <option value="{{ t.id }}" {% if item and item.tipo_ocorrencia_id == t.id %}selected{% endif %}>{{ t.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Descrição</label>
                <textarea name="descricao" class="form-control" rows="2">{{ item.descricao if item and item.descricao else '' }}</textarea>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if not item or item.ativo %}checked{% endif %}>
                    <label class="form-check-label" for="ativo">Ativo</label>
                </div>
            </div>
            <hr>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-samu-primary"><i class="bi bi-check2 me-1"></i>Salvar</button>
                <a href="{{ url_for('configuracoes.motivos_ocorrencia') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
