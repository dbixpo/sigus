{% extends 'base.html' %}
{% block title %}CID-10 — {{ 'Editar' if item else 'Novo' }}{% endblock %}

{% block content %}
<div class="page-header mb-4">
    <h1><i class="bi bi-file-medical"></i> CID-10 — {{ 'Editar' if item else 'Novo' }}</h1>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Código <span class="text-danger">*</span></label>
                <input type="text" name="codigo" class="form-control" value="{{ item.codigo if item else '' }}" required placeholder="Ex: A00, B01.2">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Descrição <span class="text-danger">*</span></label>
                <input type="text" name="descricao" class="form-control" value="{{ item.descricao if item else '' }}" required>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if not item or item.ativo %}checked{% endif %}>
                    <label class="form-check-label" for="ativo">Ativo</label>
                </div>
            </div>
            <hr>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-samu-primary"><i class="bi bi-check2 me-1"></i>Salvar</button>
                <a href="{{ url_for('configuracoes.cid10') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
