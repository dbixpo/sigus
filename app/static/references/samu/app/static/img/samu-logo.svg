<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Estrela da Vida - símbolo oficial SAMU 192 -->
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c20d2f"/>
      <stop offset="100%" style="stop-color:#a00a26"/>
    </linearGradient>
  </defs>
  <!-- Cruz/Estrela de 6 braços -->
  <g fill="none" stroke="url(#gradRed)" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="15" x2="60" y2="45"/>
    <line x1="60" y1="75" x2="60" y2="105"/>
    <line x1="30" y1="30" x2="60" y2="45"/>
    <line x1="90" y1="30" x2="60" y2="45"/>
    <line x1="30" y1="90" x2="60" y2="75"/>
    <line x1="90" y1="90" x2="60" y2="75"/>
    <line x1="15" y1="60" x2="45" y2="60"/>
    <line x1="75" y1="60" x2="105" y2="60"/>
    <line x1="30" y1="30" x2="45" y2="60"/>
    <line x1="90" y1="30" x2="75" y2="60"/>
    <line x1="30" y1="90" x2="45" y2="60"/>
    <line x1="90" y1="90" x2="75" y2="60"/>
  </g>
  <!-- Bastão de Esculápio central simplificado -->
  <line x1="60" y1="48" x2="60" y2="72" stroke="#c20d2f" stroke-width="2.5" stroke-linecap="round"/>
