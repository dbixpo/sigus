{% extends 'base.html' %}
{% block title %}Tipo de Unidade de Saúde — {{ 'Editar' if item else 'Novo' }}{% endblock %}

{% block content %}
<div class="page-header mb-4">
    <h1><i class="bi bi-tags"></i> Tipo de Unidade de Saúde — {{ 'Editar' if item else 'Novo' }}</h1>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nome <span class="text-danger">*</span></label>
                    <input type="text" name="nome" class="form-control" value="{{ item.nome if item else '' }}" required placeholder="Ex: Atenção Primária">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Sigla <span class="text-danger">*</span></label>
                    <input type="text" name="sigla" class="form-control" value="{{ item.sigla if item else '' }}" required maxlength="20" placeholder="Ex: APS, HOS">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if not item or item.ativo %}checked{% endif %}>
                        <label class="form-check-label" for="ativo">Ativo</label>
                    </div>
                </div>
            </div>
            <hr>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-samu-primary"><i class="bi bi-check2 me-1"></i>Salvar</button>
                <a href="{{ url_for('configuracoes.tipos_unidade_saude') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
