<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Sistema SAMU 192</title>
    <meta name="theme-color" content="#c20d2f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SAMU">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/samu-favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/samu-favicon.png') }}">
    <link rel="manifest" href="{{ url_for('auth.manifest_webmanifest') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/samu.css') }}" rel="stylesheet">
</head>
<body class="samu-login-page">
    <div class="samu-login-card">
        <div class="samu-login-header">
            <img src="{{ url_for('static', filename='img/samuzinho-sorocaba.jfif') }}" alt="SAMU 192" class="samu-login-logo">
            <h1>SAMU 192</h1>
            <p>Serviço de Atendimento Móvel de Urgência</p>
        </div>
        <div class="samu-login-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 mb-3">{{ message }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuário de acesso</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="usuario" class="form-control"
 required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="senha" id="senhaInput"
                               class="form-control"  required>
                        <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha()">
                            <i class="bi bi-eye" id="senhaIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        navigator.serviceWorker.register('{{ url_for("auth.sw") }}', { scope: '/' }).catch(function() {});
    }
    </script>
    <script>
    function toggleSenha() {
        var input = document.getElementById('senhaInput');
        var icon = document.getElementById('senhaIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
    </script>
</body>
</html>
