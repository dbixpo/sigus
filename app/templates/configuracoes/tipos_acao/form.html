{% extends 'base.html' %}
{% block title %}{{ 'Editar' if tipo else 'Novo' }} tipo de ação{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('configuracoes.index') }}">Configurações</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('configuracoes.tipos_acao') }}">Tipos de ação</a></li>
        <li class="breadcrumb-item active">{{ 'Editar' if tipo else 'Novo' }}</li>
    </ol>
</nav>

<div class="page-header">
    <h1>
        <i class="fas fa-images"></i>
        {{ 'Editar tema' if tipo else 'Novo tema de ação' }}
    </h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome *</label>
                        <input type="text" name="nome" id="nome" class="form-control" required maxlength="200"
                               value="{{ tipo.nome if tipo else '' }}">
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="codigo_esus">Código e-SUS (opcional)</label>
                            <input type="number" name="codigo_esus" id="codigo_esus" class="form-control"
                                   value="{{ tipo.codigo_esus if tipo and tipo.codigo_esus is not none else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="ordem">Ordem</label>
                            <input type="number" name="ordem" id="ordem" class="form-control"
                                   value="{{ tipo.ordem if tipo else 0 }}">
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label class="form-label" for="descricao">Descrição</label>
                        <textarea name="descricao" id="descricao" class="form-control" rows="3">{{ tipo.descricao if tipo else '' }}</textarea>
                    </div>
                    <div class="form-check mb-4">
                        <input type="checkbox" name="ativo" class="form-check-input" id="ativo"
                               {% if not tipo or tipo.ativo %}checked{% endif %}>
                        <label class="form-check-label" for="ativo">Tema ativo (aparece no formulário do mural)</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check-circle me-1"></i>{{ 'Salvar' if tipo else 'Cadastrar' }}
                        </button>
                        <a href="{{ url_for('configuracoes.tipos_acao') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
