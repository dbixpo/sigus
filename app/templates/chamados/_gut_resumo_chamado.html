{# Exibe resumo legível da priorização GUT.
   Params: titulo, resumo, prioridade_label, prioridade_badge #}
<div class="gut-resumo-box border rounded p-3 bg-light">
    <div class="text-muted small fw-semibold mb-2">
        <i class="fas fa-sliders me-1"></i>{{ titulo }}
    </div>
    {% if prioridade_label %}
    <div class="mb-2">
        <span class="badge bg-{{ prioridade_badge }}">{{ prioridade_label }}</span>
    </div>
    {% endif %}
    {% if resumo %}
    <div class="small text-body-secondary" style="line-height:1.5">{{ resumo }}</div>
    {% endif %}
</div>
