{% extends 'base.html' %}
{% block title %}Links Úteis{% endblock %}

{% block content %}
<div class="links-page">
    {% set _url_publica = url_publica('links.index').rstrip('/') %}
    <div class="page-header">
        <h1><i class="fas fa-link me-2"></i>Links Úteis</h1>
        <div class="btn-group btn-group-sm" role="group" aria-label="Acesso público">
            <a href="{{ url_publica('links.publico') }}" target="_blank" rel="noopener" class="btn btn-outline-primary"
               title="Abrir a página pública (sem login), só com os links liberados para todos os perfis">
                <i class="fas fa-globe me-1"></i>Acesso público
            </a>
            <button type="button" class="btn btn-outline-primary js-qr-baixar"
                    data-url="{{ _url_publica }}" data-titulo="Links Úteis" data-arquivo="qrcode-links-uteis"
                    title="Baixar QR code do acesso público">
                <i class="fas fa-qrcode"></i>
            </button>
            <button type="button" class="btn btn-outline-primary js-copiar-url"
                    data-url="{{ _url_publica }}" title="Copiar endereço do acesso público">
                <i class="fas fa-copy"></i>
            </button>
        </div>
    </div>

    {% include 'links/_conteudo.html' %}
</div>
{% endblock %}
