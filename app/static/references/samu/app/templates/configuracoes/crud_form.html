{% extends 'base.html' %}
{% block title %}{{ titulo }} — {{ 'Editar' if item else 'Novo' }}{% endblock %}

{% block content %}
<div class="page-header mb-4">
    <h1><i class="bi bi-pencil-square"></i> {{ titulo }} — {{ 'Editar' if item else 'Novo' }}</h1>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ 'Nome' if campo_nome == 'nome' else 'Código' }} <span class="text-danger">*</span></label>
                <input type="text" name="{{ campo_nome }}" class="form-control" value="{{ getattr(item, campo_nome, '') if item else '' }}" required>
            </div>
            {% if not item or (item and item.descricao is defined) %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Descrição</label>
                <textarea name="descricao" class="form-control" rows="2">{{ item.descricao if item and item.descricao else '' }}</textarea>
            </div>
            {% endif %}
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if not item or item.ativo %}checked{% endif %}>
                    <label class="form-check-label" for="ativo">Ativo</label>
                </div>
            </div>
            <hr>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-samu-primary"><i class="bi bi-check2 me-1"></i>Salvar</button>
                <a href="{{ url_for('configuracoes.' + nome_rota) }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
