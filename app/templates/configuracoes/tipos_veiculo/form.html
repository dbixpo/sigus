{% extends 'base.html' %}
{% block title %}{{ 'Editar' if tipo else 'Novo' }} veículo{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('configuracoes.index') }}">Configurações</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('configuracoes.tipos_veiculo') }}">Veículos</a></li>
        <li class="breadcrumb-item active">{{ tipo.nome if tipo else 'Novo' }}</li>
    </ol>
</nav>

<div class="page-header">
    <h1><i class="fas fa-car-side"></i> {{ 'Editar veículo' if tipo else 'Novo veículo' }}</h1>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="form-section">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Nome *</label>
                        <input type="text" name="nome" class="form-control" required maxlength="180"
                               value="{{ tipo.nome if tipo else '' }}"
                               placeholder="Ex.: Veículo de Passeio - Transporte de Equipe">
                        <div class="form-text">Use o nome do item na RENEM.</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Classificação RENEM</label>
                        <input type="text" class="form-control" value="Veículos" disabled>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descrição</label>
                        <textarea name="descricao" class="form-control" rows="3"
                                  placeholder="Observação local, se precisar.">{{ tipo.descricao if tipo and tipo.descricao else '' }}</textarea>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input type="checkbox" name="ativo" class="form-check-input" id="ativo"
                                   {% if not tipo or tipo.ativo %}checked{% endif %}>
                            <label class="form-check-label" for="ativo">
                                Ativo (aparece ao cadastrar o carro na unidade)
                            </label>
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check-circle me-1"></i>
                        {{ 'Salvar' if tipo else 'Cadastrar' }}
                    </button>
                    <a href="{{ url_for('configuracoes.tipos_veiculo') }}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
