<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D3B5E">
<title>Links Úteis · {{ identidade.nome_sistema }}</title>
<link rel="icon" type="image/png" href="{{ identidade.asset_url('favicon') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
body { background: #F4F6F9; color: #1E3A50; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; min-height: 100vh; }
.pub-faixa { height: 4px; background: linear-gradient(90deg, #E63030 0 33.3%, #F5C500 33.3% 66.6%, #1A82B8 66.6% 100%); }
.pub-topo { background: #0D3B5E; border-bottom: 3px solid #1A82B8; padding: 14px 20px; }
.pub-topo-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.pub-topo img { height: 40px; }
.pub-topo-titulo { color: #fff; line-height: 1.2; }
.pub-topo-titulo strong { display: block; font-size: 1.05rem; }
.pub-topo-titulo small { font-size: .72rem; opacity: .75; }
.pub-main { padding: 24px 16px 40px; }
.pub-rodape { text-align: center; font-size: .75rem; color: #718096; padding: 0 16px 28px; }
.pub-rodape a { color: #1A82B8; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="pub-faixa"></div>
<header class="pub-topo">
    <div class="pub-topo-inner">
        <img src="{{ identidade.asset_url('logo_escuro') }}" alt="{{ identidade.nome_sistema }}" onerror="this.style.display='none'">
        <div class="pub-topo-titulo">
            <strong>Links Úteis</strong>
            <small>{{ identidade.secretaria }} · {{ identidade.municipio }}/{{ identidade.uf }}</small>
        </div>
    </div>
</header>

<main class="pub-main">
    <div class="links-page">
        {% include 'links/_conteudo.html' %}
    </div>
</main>

<footer class="pub-rodape">
    {{ identidade.nome_sistema }} · <a href="{{ url_for('auth.login') }}">Entrar no sistema</a>
</footer>
<script src="{{ url_for('static', filename='js/qrcode.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/acesso-publico.js') }}?v=20261006c"></script>
</body>
</html>
